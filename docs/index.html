<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status · Tenanci</title>
<meta name="description" content="Situação dos serviços da Tenanci: painel, API, documentação e proxy dos domínios.">
<style>
  :root {
    color-scheme: light;
    --bg: oklch(0.99 0.002 286);
    --fg: oklch(0.21 0.02 286);
    --card: oklch(1 0 0);
    --muted: oklch(0.5 0.02 286);
    --border: oklch(0.91 0.008 286);
    --primary: oklch(0.56 0.22 285);
    --ok: oklch(0.6 0.15 155);
    --bad: oklch(0.58 0.2 25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: oklch(0.16 0.012 286);
      --fg: oklch(0.96 0.005 286);
      --card: oklch(0.2 0.014 286);
      --muted: oklch(0.7 0.015 286);
      --border: oklch(0.3 0.014 286);
      --primary: oklch(0.64 0.2 285);
      --ok: oklch(0.68 0.15 155);
      --bad: oklch(0.68 0.18 25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 16px 4rem; }
  .brand { color: var(--primary); font-weight: 700; font-size: 1.25rem; text-decoration: none; letter-spacing: -0.02em; }
  h1 { margin: 1.5rem 0 0.25rem; font-size: 1.75rem; letter-spacing: -0.02em; }
  .summary { margin: 0 0 1.5rem; color: var(--muted); }
  .banner { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border-radius: 0.85rem; border: 1px solid var(--border); background: var(--card); font-weight: 600; margin-bottom: 1rem; }
  .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 0.85rem; background: var(--card); overflow: hidden; }
  li { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .name { flex: 1; font-weight: 500; }
  .meta { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: 0.875rem; }
  a { color: var(--primary); }
</style>
</head>
<body>
<main>
  <a class="brand" href="https://tenanci.com">tenanci</a>
  <h1>Status dos serviços</h1>
  <p class="summary" id="updated">Carregando…</p>
  <div class="banner"><span class="dot" id="all-dot"></span><span id="all-text">Verificando…</span></div>
  <ul id="list"></ul>
  <footer>
    Checagem automática a cada 5 minutos, de fora da nossa infraestrutura.
    <a href="https://github.com/tenanci/status/issues?q=is%3Aissue">Histórico de incidentes</a>
  </footer>
</main>
<script>
  const fmt = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
  fetch("status.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((s) => {
      const allOk = s.checks.every((c) => c.ok);
      document.getElementById("all-dot").className = "dot " + (allOk ? "ok" : "bad");
      document.getElementById("all-text").textContent = allOk ? "Todos os serviços funcionando" : "Há serviços com problema";
      document.getElementById("updated").textContent = "Última checagem: " + fmt(s.updated);
      document.getElementById("list").innerHTML = s.checks
        .map((c) => `<li><span class="dot ${c.ok ? "ok" : "bad"}"></span><span class="name">${c.name}</span><span class="meta">${c.ok ? "Funcionando · " + c.ms + " ms" : "Fora do ar"}</span></li>`)
        .join("");
    })
    .catch(() => {
      document.getElementById("updated").textContent = "Não foi possível ler a última checagem.";
    });
</script>
</body>
</html>
